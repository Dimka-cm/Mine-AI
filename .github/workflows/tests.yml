name: Тесты

# Гоняем на каждый пуш и пул-реквест. Публичный репозиторий — минуты
# GitHub-hosted раннеров бесплатны и без месячного лимита.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # можно запустить руками из вкладки Actions

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20     # задаём явно: молчаливое падение в 6 часов не нужно

    steps:
      - uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Кэш пакетов pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Поставить зависимости
        # CPU-сборка torch: она в разы легче, а для тестов GPU не нужен.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest

      - name: Тесты
        run: python -m pytest tests/ -q

      - name: Проверить синтаксис JS-моста
        run: node --check bot/bridge.js

      - name: Проверить, что все .py разбираются
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for f in pathlib.Path('.').rglob('*.py'):
              if '.git' in f.parts:
                  continue
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("все .py разбираются")
          PY
